<article class="seminar">
  <p class="date">{{ seminar.date | date: "%B %-d, %Y" }}</p>
  <h3>{{ seminar.presenter }}</h3>
  <p class="affiliation">{{ seminar.affiliation }}</p>
  <p class="talk-title">{{ seminar.talk_title }}</p>

  {% if seminar.recording_link and seminar.recording_link != "" %}
    <p><a href="{{ seminar.recording_link }}">Watch recording</a></p>
  {% endif %}
</article>
